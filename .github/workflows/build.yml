name: Build

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ 'main' ]

env:
  godot-version: 4.5
  windows-installer-name: Kintsugi3DViewer-windows-installer.exe
  windows-name: Kintsugi3DViewer-windows.zip
  macos-name: Kintsugi3DViewer-macos.zip

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        if: github.ref_type == 'tag'
        uses: actions/checkout@v4

      - name: Create draft release if needed
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file RELEASE.md \
              --draft
          fi

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    needs: [ 'prepare-release']
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        shell: pwsh
        run: |
          curl.exe -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_win64.exe.zip"
          Expand-Archive godot.zip -DestinationPath godot
          Move-Item "godot/Godot_v${{ env.godot-version }}-stable_win64.exe" Godot.exe

      - name: Install Godot export templates
        shell: pwsh
        run: |
          curl.exe -L -o godot-templates.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_export_templates.tpz"
          Expand-Archive godot-templates.zip -DestinationPath godot-templates

          $templateDir = "$env:APPDATA/Godot/export_templates/${{ env.godot-version }}.stable"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          Copy-Item godot-templates/templates/* $templateDir -Recurse -Force

      - name: Update project imports
        run: ./Godot.exe --headless --import --verbose

      - name: Build project
        shell: pwsh
        run: |
          $output = Join-Path $PWD "export/Kintsugi3DViewer.exe"
          New-Item -ItemType Directory -Force export | Out-Null
          ./Godot.exe --headless --path . --export-release "Windows Desktop (with environments)" "$output" --verbose

      - name: Package Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path "export/Kintsugi3DViewer.exe" -DestinationPath "${{ env.windows-name }}"
      
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        run: makensis -V3 installer.nsi

      - name: Smoke test Windows ZIP
        shell: pwsh
        run: |
          Expand-Archive "${{ env.windows-name }}" -DestinationPath extracted

          $exe = Join-Path $PWD "extracted/Kintsugi3DViewer.exe"
          if (!(Test-Path $exe)) {
            throw "Executable missing from ZIP."
          }

          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 30
          $p.Refresh()

          if ($p.HasExited) {
            throw "App failed to launch or exited within 30 seconds with code $($p.ExitCode)."
          }

          Write-Host "App remained open for 30 seconds."
          Stop-Process -Id $p.Id -Force

      - name: Install application
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "export/${{ env.windows-installer-name }}"
          if (!(Test-Path $installer)) {
            throw "Installer missing: $installer"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Kintsugi3DViewer"
          $p = Start-Process -FilePath $installer `
            -ArgumentList "/S", "/D=$installDir" -Wait -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Installer exited with code $($p.ExitCode)."
          }

          $exe = Join-Path $installDir "Kintsugi3DViewer.exe"
          if (!(Test-Path $exe)) {
            throw "Installed executable missing."
          }

          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (!(Test-Path $uninstaller)) {
            throw "Uninstaller missing."
          }

          "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

      - name: Smoke test installed executable
        shell: pwsh
        run: |
          $exe = Join-Path $env:INSTALL_DIR "Kintsugi3DViewer.exe"
          $p = Start-Process -FilePath $exe `
            -WorkingDirectory $env:INSTALL_DIR -PassThru

          Start-Sleep -Seconds 30
          $p.Refresh()

          if ($p.HasExited) {
            throw "App failed to launch or exited within 30 seconds with code $($p.ExitCode)."
          }

          Stop-Process -Id $p.Id -Force
          Write-Host "App remained open for 30 seconds."

      - name: Uninstall application
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:INSTALL_DIR "uninstall.exe"
          $p = Start-Process -FilePath $uninstaller `
            -ArgumentList "/S" -Wait -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($p.ExitCode)."
          }

          if (Test-Path (Join-Path $env:INSTALL_DIR "Kintsugi3DViewer.exe")) {
            throw "Application executable still exists after uninstall."
          }

          Write-Host "App successfully uninstalled."

      - name: Upload Windows release assets
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ env.windows-name }}" \
            "export/${{ env.windows-installer-name }}" \
            --clobber

  macos:
    name: macOS build and tests
    runs-on: macos-latest
    needs: [ 'prepare-release' ]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_macos.universal.zip"
          unzip -q godot.zip

      - name: Install Godot export templates
        run: |
          curl -L -o godot-templates.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_export_templates.tpz"
          unzip -q godot-templates.zip
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${{ env.godot-version }}.stable/
          mv ./templates/* ~/Library/Application\ Support/Godot/export_templates/${{ env.godot-version }}.stable/

      - name: Update project imports
        run: ./Godot.app/Contents/MacOS/Godot --headless --import --verbose

      - name: Build project
        run: |
          mkdir -p export
          ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release "macOS (all environments)" "export/${{ env.macos-name }}" --verbose

      - name: Extract macOS ZIP
        run: unzip -q "export/${{ env.macos-name }}" -d extracted

      - name: Install timeout utility
        run: brew install coreutils

      - name: Smoke-test macOS app
        shell: bash
        run: |
          APP="extracted/Kintsugi 3D Viewer.app"
          EXE="$APP/Contents/MacOS/Kintsugi 3D Viewer"

          # Test 1: Run the executable directly and check whether it exits early.
          "$EXE" &
          PID=$!
          sleep 30

          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            wait "$PID" 2>/dev/null || true
            echo "App remained open for 30 seconds (direct executable launch)."
          else
            if wait "$PID"; then
              STATUS=0
            else
              STATUS=$?
            fi
            echo "App failed to launch or exited within 30 seconds with code $STATUS (direct executable launch)."
            exit 1
          fi

          # Test 2: Launch as a user would and require it to remain open for 30 seconds.
          Gtimeout="$(brew --prefix coreutils)/bin/gtimeout"
          set +e
          "$Gtimeout" --kill-after=5s 30s open -W -n "$APP"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 124 ]; then
            echo "App remained open for 30 seconds (app launched with 'open')."
          else
            echo "App failed to launch or exited within 30 seconds with code $STATUS (app launched with 'open')."
            exit 1
          fi

      - name: Upload macOS release asset
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "export/${{ env.macos-name }}" --clobber