name: Build

on:
  push:
    branches: [ "main", "build-automation" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  godot-version: 4.5
  godot-bin: "./Godot"

jobs:    
  build-windows:
    name: "Build for Windows"
    runs-on: ubuntu-latest
    env:
      project-build: "Windows Desktop (single environment)"
      artifact-name: "windows-${{ github.ref_name }}"
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -L -o ./godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_linux.x86_64.zip"
          unzip ./godot.zip
          mv Godot* ${{ env.godot-bin }}

      - name: Install Godot export templates
        run: |
          curl -L -o ./godot-templates.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_export_templates.tpz"
          unzip godot-templates.zip
          mv ./templates/* ~/.local/share/godot/export_templates/${{ env.godot-version }}.stable/
          
      - name: Update project imports
        run: ${{ env.godot-bin }} --headless --import --verbose
        
      - name: Build project
        run: ${{ env.godot-bin }} --headless --path . --export-release "${{ env.project-build }}" build/ --verbose

      - name: Zip artifacts
        run: zip build/* ${{ env.artifact-name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact-name }}
          path: .

      - name: Install NSIS
        if: github.ref_type == 'tag'
        run: sudo apt install nsis

      - name: Make installer
        if: github.ref_type == 'tag'
        run: makensis installer.nsi

      - name: Upload release
        if: github.ref_type == 'tag'
        run: ""
    
  build-macos:
    name: "Build for MacOS"
    runs-on: ubuntu-latest
    env:
      project-build: "macOS (single environment)"
      artifact-name: "macos-${{ github.ref_name }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -L -o ./godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_linux.x86_64.zip"
          unzip ./godot.zip
          mv Godot* ${{ env.godot-bin }}

      - name: Install Godot export templates
        run: |
          curl -L -o ./godot-templates.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_export_templates.tpz"
          unzip godot-templates.zip
          mv ./templates/* ~/.local/share/godot/export_templates/${{ env.godot-version }}.stable/
          
      - name: Update project imports
        run: ${{ env.godot-bin }} --headless --import --verbose
        
      - name: Build project
        run: ${{ env.godot-bin }} --headless --path . --export-release "${{ env.project-build }}" build/ --verbose

      - name: Zip artifacts
        run: zip build/* ${{ env.artifact-name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact-name }}
          path: .

      - name: Upload release
        if: github.ref_type == 'tag'
        run: ""
          
