name: Build

on:
  push:
    branches: [ "main", "build-automation" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  godot-version: 4.5

jobs:
  build-windows:
    name: "Build for Windows"
    runs-on: ubuntu-latest
    env:
      project-build: "Windows Desktop (with environments)"
      artifact-name: "windows-${{ github.ref_name }}"
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: sudo apt install nsis

      - name: Install Godot
        run: |
          curl -L -o ./godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_linux.x86_64.zip"
          unzip ./godot.zip
          mv Godot* Godot

      - name: Build project
        run: ./Godot --headless --path ./project.godot --export-release "${{ env.project-build }}" build/

      - name: Zip artifacts
        run: zip build/* ${{ env.artifact-name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact-name }}
          path: .

      - name: Make installer
        if: github.ref_type == 'tag'
        run: makensis installer.nsi

      - name: Upload release
        if: github.ref_type == 'tag'
        run: ""
    
  build-macos:
    name: "Build for MacOS"
    runs-on: ubuntu-latest
    env:
      project-build: "MacOS (all environments)"
      artifact-name: "macos-${{ github.ref_name }}"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Install Godot
        run: |
          curl -L -o ./godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_linux.x86_64.zip"
          unzip ./godot.zip
          mv Godot* Godot

      - name: Build project
        run: ./Godot --headless --path ./project.godot --export-release "${{ env.project-build }}" build/

      - name: Zip artifacts
        run: zip build/* ${{ env.artifact-name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact-name }}
          path: .

      - name: Upload release
        if: github.ref_type == 'tag'
        run: ""
          
