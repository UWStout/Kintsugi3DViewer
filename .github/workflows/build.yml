name: Build

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ 'main' ]

env:
  godot-version: 4.5
  godot-bin: ./Godot
  windows-installer-name: Kintsugi3DViewer-windows-installer.exe
  windows-name: Kintsugi3DViewer-windows.zip
  macos-name: Kintsugi3DViewer-macos.zip

jobs:    
  build:
    name: ${{ matrix.type }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - type: Windows Desktop (with environments)
            name: Kintsugi3DViewer.exe
          
          - type: macOS (all environments)
            name: Kintsugi3DViewer-macos.zip
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -L -o ./godot.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_linux.x86_64.zip"
          unzip ./godot.zip
          mv Godot* ${{ env.godot-bin }}

      - name: Install Godot export templates
        run: |
          curl -L -o ./godot-templates.zip "https://github.com/godotengine/godot/releases/download/${{ env.godot-version }}-stable/Godot_v${{ env.godot-version }}-stable_export_templates.tpz"
          unzip godot-templates.zip
          mkdir -p ~/.local/share/godot/export_templates/${{ env.godot-version }}.stable/
          mv ./templates/* ~/.local/share/godot/export_templates/${{ env.godot-version }}.stable/
          
      - name: Update project imports
        run: ${{ env.godot-bin }} --headless --import --verbose
        
      - name: Build project
        run: |
          mkdir export/
          ${{ env.godot-bin }} --headless --path . --export-release "${{ matrix.type }}" "export/${{ matrix.name }}" --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: export/*

  package-windows:
    name: Package Windows ZIP
    runs-on: ubuntu-latest
    needs: [ 'build' ]
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: Kintsugi3DViewer.exe

      - name: Create ZIP package
        run: |
          zip ${{ env.windows-name }} Kintsugi3DViewer.exe

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.windows-name }}
          path: ${{ env.windows-name }} 

  package-windows-installer:
    name: Build NSIS installer
    runs-on: ubuntu-latest
    needs: [ 'build' ]
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: Kintsugi3DViewer.exe
          path: export

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Make installer
        run: makensis -V3 installer.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.windows-installer-name }}
          path: export/${{ env.windows-installer-name }}

  smoke-test-windows:
    name: Smoke test Windows ZIP
    runs-on: windows-latest
    needs: [ 'package-windows' ]
    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.windows-name }}

      - name: Extract ZIP
        shell: pwsh
        run: Expand-Archive ${{ env.windows-name }} -DestinationPath extracted

      - name: Launch and check for immediate crash
        shell: pwsh
        run: |
          # Generated by ChatGPT
          $exe = Join-Path $PWD "extracted/Kintsugi3DViewer.exe"
          if (!(Test-Path $exe)) {
            throw "Executable missing from ZIP."
          }

          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 30
          $p.Refresh()

          if ($p.HasExited) {
            throw "Application exited within 30 seconds with code $($p.ExitCode)."
          }

          Stop-Process -Id $p.Id -Force

  smoke-test-macos:
    name: Smoke test macOS ZIP
    runs-on: macos-latest
    needs: [ 'build' ]
    steps:
      - name: Download macOS ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.macos-name }}

      - name: Extract macOS ZIP
        run: unzip ${{ env.macos-name }}

      - name: Install timeout
        run: brew install coreutils

      - name: Smoke-test macOS app
        shell: bash
        run: |
          # Generated by ChatGPT
          APP="Kintsugi 3D Viewer.app"
          EXE="$APP/Contents/MacOS/Kintsugi 3D Viewer"

          # Test 1: Run the executable directly and check whether it exits early.
          "$EXE" &
          PID=$!
          sleep 30

          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID"
            wait "$PID" 2>/dev/null || true
          else
            if wait "$PID"; then
              STATUS=0
            else
              STATUS=$?
            fi
            echo "Application exited within 30 seconds with code $STATUS."
            exit 1
          fi

          # Test 2: Launch as a user would and require it to remain open for 30 seconds.
          Gtimeout="$(brew --prefix coreutils)/bin/gtimeout"
          set +e
          "$Gtimeout" --kill-after=5s 30s open -W -n "$APP"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 124 ]; then
            echo "App remained open for 30 seconds."
          else
            echo "App exited early or failed to launch (status $STATUS)"
            exit 1
          fi

  smoke-test-windows-installer:
    name: Smoke test NSIS installer
    runs-on: windows-latest
    needs: [ 'package-windows-installer' ]
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.windows-installer-name }}
          path: package

      - name: Install application
        shell: pwsh
        run: |
          # Generated by ChatGPT
          $installer = Join-Path $PWD "package/${{ env.windows-installer-name }}"
          if (!(Test-Path $installer)) {
            throw "Installer artifact missing."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "Kintsugi3DViewer"
          $p = Start-Process -FilePath $installer `
            -ArgumentList "/S", "/D=$installDir" -Wait -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Installer exited with code $($p.ExitCode)."
          }

          $exe = Join-Path $installDir "Kintsugi3DViewer.exe"
          if (!(Test-Path $exe)) {
            throw "Installed executable missing."
          }

          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (!(Test-Path $uninstaller)) {
            throw "Uninstaller missing."
          }

          echo "INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

      - name: Smoke test installed executable
        shell: pwsh
        run: |
          # Generated by ChatGPT
          $exe = Join-Path $env:INSTALL_DIR "Kintsugi3DViewer.exe"
          $p = Start-Process -FilePath $exe `
            -WorkingDirectory $env:INSTALL_DIR -PassThru

          Start-Sleep -Seconds 5
          $p.Refresh()

          if ($p.HasExited) {
            throw "Installed application exited early with code $($p.ExitCode)."
          }

          Stop-Process -Id $p.Id -Force

      - name: Uninstall application
        shell: pwsh
        run: |
          # Generated by ChatGPT
          $uninstaller = Join-Path $env:INSTALL_DIR "uninstall.exe"
          $p = Start-Process -FilePath $uninstaller `
            -ArgumentList "/S" -Wait -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($p.ExitCode)."
          }

          if (Test-Path (Join-Path $env:INSTALL_DIR "Kintsugi3DViewer.exe")) {
            throw "Application executable still exists after uninstall."
          }

  publish-release-draft:
    name: Publish release draft
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - smoke-test-windows
      - smoke-test-macos
      - smoke-test-windows-installer
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.windows-name }}

      - name: Download macOS ZIP
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.macos-name }}

      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.windows-installer-name }}

      - name: Create or update draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              ${{ env.windows-name }} \
              ${{ env.macos-name }} \
              ${{ env.windows-installer-name }} \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              ${{ env.windows-name }} \
              ${{ env.macos-name }} \
              ${{ env.windows-installer-name }} \
              --title "${{ github.ref_name }}" \
              --notes-file RELEASE.md \
              --draft
          fi
